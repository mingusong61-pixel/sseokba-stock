<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>테디봇 주식 거래소</title>
<meta name="description" content="카톡 테디봇과 같은 계좌로 하는 주식과 던전">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0F3; --surface:#FFFFFF; --ink:#1C2230; --muted:#5B6474; --line:#D5D9E0;
  --board:#14171F; --board-line:#262B36; --board-ink:#E8EAEE; --board-dim:#7D8597;
  --up:#D92B2F; --down:#2563D9; --led-up:#FF5A55; --led-down:#5AA8FF; --led-flat:#C9CDD6;
  --brand:#FEE500; --brand-ink:#191600; --warn:#9A5B00; --warn-bg:#FFF4D6;
  --hp:#2FBF71; --hp-low:#E8A317; --hp-crit:#FF5A55; --boss:#FF5A55; --gold:#B8860B;
  --radius-s:6px; --radius-m:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1218; --surface:#171B23; --ink:#E6E8EC; --muted:#98A0AE; --line:#2A303B;
    --board:#07090D; --board-line:#1D222B; --up:#FF5A55; --down:#5AA8FF; --warn:#FFC857; --warn-bg:#2B2410; --gold:#E2B33C;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1218; --surface:#171B23; --ink:#E6E8EC; --muted:#98A0AE; --line:#2A303B;
  --board:#07090D; --board-line:#1D222B; --up:#FF5A55; --down:#5AA8FF; --warn:#FFC857; --warn-bg:#2B2410; --gold:#E2B33C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:15px;margin:14px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--down);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
.who{font-size:14px;color:var(--muted);text-align:right}
.who b{color:var(--ink);font-weight:500}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:4px}
.tabs button{border:0;background:none;border-radius:var(--radius-s);padding:9px;font-weight:700;font-size:16px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}

/* 전광판 */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--radius-m);padding:14px 14px 10px;box-shadow:inset 0 0 0 1px var(--board-line)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--board-dim);font-size:13px;padding:0 4px 8px}
.clock{font-family:"DotGothic16",monospace;color:var(--board-ink);font-size:15px;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr auto 64px;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--board-line);padding:10px 4px;text-align:left;color:inherit;border-radius:4px}
.row:first-of-type{border-top:0}
.row[aria-pressed="true"]{background:#ffffff0f}
.row .name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font-family:"DotGothic16",monospace;text-align:right;line-height:1.2}
.row .price{font-size:22px;letter-spacing:.02em}
.row .chg{font-size:14px}
.row svg{display:block;width:64px;height:24px}
.up{color:var(--led-up)} .down{color:var(--led-down)} .flat{color:var(--led-flat)}
.flash{animation:flash .9s ease-out}
@keyframes flash{from{background:#ffffff26}to{background:transparent}}
.chart{padding:10px 4px 4px;border-top:1px solid var(--board-line)}
.chart svg{display:block;width:100%;height:120px}
.chart-meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--board-dim)}
.chart-cap{font-size:14px;color:var(--board-ink);padding-bottom:6px}
.notice{margin:12px 0 0;padding:10px 12px;border-radius:var(--radius-s);background:var(--warn-bg);color:var(--warn);font-size:14px}

section{margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{font-size:13px;color:var(--muted)}
.sum b{display:block;font-size:17px;color:var(--ink);font-weight:700}
.list{margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.pl-up{color:var(--up)} .pl-down{color:var(--down)}
.empty{color:var(--muted);font-size:15px;margin:0}

/* 주문 */
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.qty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qty input[type=number],.inp{width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);font:inherit}
.qty label{display:flex;align-items:center;gap:6px;font-size:15px}
.est{font-size:14px;color:var(--muted);min-height:22px;margin-bottom:12px}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trade button{border:0;border-radius:var(--radius-s);padding:13px;font-weight:700;font-size:17px;color:#fff}
.buy{background:var(--up)} .sell{background:var(--down)}
button:disabled{opacity:.45;cursor:not-allowed}
.result{margin-top:12px;font-size:15px;white-space:pre-line}
.result.err{color:var(--warn)}

/* 연결 */
.connect p{margin:0 0 10px}
.code{font-family:"DotGothic16",monospace;font-size:20px;letter-spacing:.04em;background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius-s);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.code span{white-space:nowrap;overflow-x:auto;min-width:0}
.brand{background:var(--brand);color:var(--brand-ink);border:0;border-radius:var(--radius-s);padding:11px 16px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 10px;font-size:14px;white-space:nowrap;flex:none}
.small{font-size:14px;color:var(--muted)}

/* 순위 */
.rank{width:100%;border-collapse:collapse;font-size:15px}
.rank td{padding:8px 4px;border-top:1px solid var(--line)}
.rank tr:first-child td{border-top:0}
.rank td:first-child{width:2.2em;color:var(--muted)}
.rank td:last-child{text-align:right}
.rank tr.me td{font-weight:700}
footer{margin-top:32px;font-size:13px;color:var(--muted)}

/* ---- 던전 ---- */
.reply{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--radius-s);padding:10px 12px;font-size:14px;white-space:pre-line;margin:0 0 14px}
.reply.err{border-left-color:var(--warn);color:var(--warn)}
.reply:empty{display:none}
.slots{display:grid;gap:0}
.slot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 4px;border-top:1px solid var(--board-line);align-items:center}
.slot:first-child{border-top:0}
.slot .dn{font-size:16px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.slot .bs{font-size:13px;color:var(--board-dim);grid-column:1}
.slot .cnt{font-family:"DotGothic16",monospace;font-size:18px;text-align:right}
.slot .pp{grid-column:1/-1;font-size:13px;color:var(--board-dim)}
.slot .sb{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--board-line);color:var(--board-dim);white-space:nowrap}
.chip.run{color:var(--led-up);border-color:#5a2526}.chip.win{color:var(--hp);border-color:#1d4a33}.chip.lose{color:var(--board-dim)}
.bbtn{border:1px solid #3a4252;background:#1E2430;color:var(--board-ink);border-radius:var(--radius-s);padding:6px 12px;font-size:14px;font-weight:500}
.bbtn.go{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.fight .bossname{font-size:18px;font-weight:700;padding:0 4px}
.bar{height:12px;background:#ffffff14;border-radius:999px;overflow:hidden;margin:6px 4px 2px}
.bar i{display:block;height:100%;background:var(--boss);border-radius:999px;transition:width .5s}
.bar.me i{background:var(--hp)}
.bar.thin{height:6px;margin:3px 0 0}
.bar.thin i{background:var(--hp)} .bar.thin.low i{background:var(--hp-low)} .bar.thin.crit i{background:var(--hp-crit)}
.hpnum{font-family:"DotGothic16",monospace;font-size:13px;color:var(--board-dim);padding:0 4px;display:flex;justify-content:space-between}
.fx{display:flex;flex-wrap:wrap;gap:6px;padding:6px 4px 2px}
.party{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.party li{padding:6px 4px;border-top:1px solid var(--board-line);font-size:14px}
.party li.dead{opacity:.5}
.party .pn{display:flex;justify-content:space-between;gap:8px}
.party .pn span:last-child{font-family:"DotGothic16",monospace;color:var(--board-dim);font-size:12px}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:10px 8px;text-align:left;min-height:56px}
.act b{display:block;font-size:15px}
.act small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.act.atk{grid-column:1/-1;background:var(--up);color:#fff;border:0;text-align:center}
.act.atk small{color:#ffffffcc}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.xp{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 10px}
.xp i{display:block;height:100%;background:var(--gold)}
.jobs{display:flex;flex-wrap:wrap;gap:6px}
.job{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px}
.job[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.job.locked{opacity:.38;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 12px;font-size:15px;font-weight:500}
.btn.main{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bag{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;margin:0;padding:0;list-style:none}
.gear li{grid-template-columns:1fr auto}
.gear .gb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.craft{display:grid;gap:10px}
.craft select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.need{font-size:14px}
.need .lack{color:var(--up);font-weight:700}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500}
.jinfo{font-size:14px;margin:8px 0 0;padding:0;list-style:none}
.jinfo li{padding:8px 0;border-top:1px solid var(--line)}
.jinfo .sk{color:var(--muted);font-size:13px;white-space:pre-line}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.bar i{transition:none}}
@media (max-width:420px){.row .price{font-size:19px}.sum b{font-size:15px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>테디봇 거래소</h1>
    <div class="who" id="who">연결 안 됨</div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabStock" aria-selected="true" aria-controls="paneStock">📈 주식</button>
    <button role="tab" id="tabDg" aria-selected="false" aria-controls="paneDg">🧭 던전</button>
  </div>

  <!-- 주식 -->
  <div id="paneStock" role="tabpanel" aria-labelledby="tabStock">
    <div class="board" aria-live="polite">
      <div class="board-head"><span id="status">시세 불러오는 중</span><span class="clock" id="clock"></span></div>
      <div id="rows"></div>
      <div class="chart" id="chart" hidden>
        <div class="chart-cap" id="chartSpan"></div>
        <svg id="chartSvg" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="chart-meta"><span id="chartLo"></span><span id="chartHi"></span></div>
      </div>
    </div>
    <p class="notice" id="notice" hidden></p>

    <section id="account">
      <h2 id="accTitle">내 계좌</h2>
      <div class="panel" id="accBody"></div>
    </section>

    <section id="orderSec">
      <h2>주문</h2>
      <div class="panel">
        <div class="picks" id="picks" role="group" aria-label="종목"></div>
        <div class="qty">
          <input type="number" id="qty" min="1" step="1" value="1" inputmode="numeric" aria-label="수량">
          <span>주</span>
          <label><input type="checkbox" id="all"> 전부</label>
        </div>
        <div class="est" id="est"></div>
        <div class="trade">
          <button class="buy" id="buyBtn">매수</button>
          <button class="sell" id="sellBtn">매도</button>
        </div>
        <div class="result" id="result" role="status"></div>
      </div>
    </section>

    <section>
      <h2>순위</h2>
      <div class="panel"><table class="rank" id="rank"></table></div>
    </section>
  </div>

  <!-- 던전 -->
  <div id="paneDg" role="tabpanel" aria-labelledby="tabDg" hidden>
    <div class="reply" id="dgReply" role="status" aria-live="polite"></div>
    <div id="dgOff" class="panel hidden"><p class="empty">지금 던전봇이 꺼져 있어요.</p></div>
    <div id="dgBody">
      <div id="dgConnect" class="panel connect hidden"></div>
      <div id="fightBox"></div>
      <section style="margin-top:14px">
        <div class="board">
          <div class="board-head"><span>🧭 열린 던전</span><span class="clock" id="dgClock"></span></div>
          <div class="slots" id="slots"></div>
        </div>
      </section>
      <section id="charSec">
        <h2>내 캐릭터</h2>
        <div class="panel" id="charBody"></div>
      </section>
      <section id="bagSec">
        <h2>배낭 · 제작 · 강화</h2>
        <div class="panel" id="bagBody"></div>
      </section>
      <section id="othersSec">
        <h2>다른 전투</h2>
        <div class="panel" id="others"></div>
      </section>
      <section>
        <h2>정보</h2>
        <div class="panel" id="info"></div>
      </section>
    </div>
  </div>

  <footer>카톡 봇과 같은 계좌예요. 사이트에서 한 것도 카톡 ^잔액, ^내주식, ^배낭에 바로 반영돼요. 작동 시간(오전 8시~오후 10시)에만 주문할 수 있어요.</footer>
</main>

<script>

  const store = {

  // 봇 답장의 명령 표시를 이 앱에 맞게 (^ → :)

  let encKey = null, sigKey = null;

  const lastPrice = {};

  async function keys() {
    if (!window.crypto || !crypto.subtle) throw new Error("insecure");
    encKey = await crypto.subtle.importKey("spki", unb64(ENC_SPKI), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    sigKey = await crypto.subtle.importKey("spki", unb64(SIG_SPKI), { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["verify"]);
  }
  async function seal(obj) {
    const bytes = enc.encode(JSON.stringify(obj));
    if (bytes.length > 190) throw new Error("too long");
    return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, encKey, bytes));
  }
  async function sha256Hex(s) {
    const hh = await crypto.subtle.digest("SHA-256", enc.encode(s));
    return [...new Uint8Array(hh)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function randomText(n, chars) {
    const v = crypto.getRandomValues(new Uint8Array(n));
    return [...v].map(x => chars[x % chars.length]).join("");
  }
  const req = (path, opt) => fetch(`${DB}/${path}.json`, opt).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));

  // ---- 시세 받기 (봇 서명 확인) ----
  async function poll() {
    try {
      const at = await req("pub_at");
      if (at !== pubAt || !data) {
        const pub = await req("pub");
        if (pub && pub.d && pub.s) {
          const ok = await crypto.subtle.verify("RSASSA-PKCS1-v1_5", sigKey, unb64(pub.s), enc.encode(pub.d));
          if (ok) { data = JSON.parse(pub.d); pubAt = at; render(); }
          else showNotice("시세 서명이 맞지 않아서 무시했어요. 잠시 뒤 다시 받아와요.");
        }
      }
      tick();
    } catch (e) {
      $("status").textContent = "시세를 못 받았어요. 다시 시도하는 중";
    }
  }

  function showNotice(t) { const n = $("notice"); n.textContent = t || ""; n.hidden = !t; }

  // ---- 주문 보내기 (주식·던전 공통). 봇 답장 글을 돌려줌 ----
  async function sendOrder(fields) {
    const token = store.get("token");
    if (!token) throw new Error("nolink");
    const sealed = await seal(Object.assign({ t: token, n: randomText(10, CODE_CHARS), a: Date.now() }, fields));
    const { name } = await req("orders", { method: "POST", body: JSON.stringify(sealed) });
    const until = Date.now() + 20000;
    while (Date.now() < until) {
      await new Promise(r => setTimeout(r, 600));
      const res = await req(`res/${name}`).catch(() => null);
      if (res) {
        fetch(`${DB}/res/${name}.json`, { method: "DELETE" }).catch(() => {});
        pubAt = null;
        return { ok: !!res.ok, m: fixText(res.m) };
      }
    }
    return { ok: false, m: `봇이 20초 동안 답하지 않았어요. ${BOT_HOST}이 켜져 있는지 확인해 주세요.`, timeout: true };
  }

  // ---- 화면 ----
  function setTab(t) {
    tab = t; store.set("tab", t);
    $("tabStock").setAttribute("aria-selected", String(t === "stock"));
    $("tabDg").setAttribute("aria-selected", String(t === "dg"));
    $("paneStock").hidden = t !== "stock";
    $("paneDg").hidden = t !== "dg";
  }

  function changeOf(s) {
    if (!s.pv || s.p === s.pv) return { cls: "flat", txt: "0.00%", arrow: "–" };
    const pct = (s.p - s.pv) * 100 / s.pv;
    const a = Math.abs(pct);
    return { cls: pct > 0 ? "up" : "down", txt: (a < 0.1 ? a.toFixed(2) : a.toFixed(1)) + "%", arrow: pct > 0 ? "▲" : "▼" };
  }
  function spark(hist, w, hgt, pad) {
    const pts = hist.slice(-31);
    if (pts.length < 2) return "";
    const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
    return pts.map((v, i) => `${(pad + i * (w - 2 * pad) / (pts.length - 1)).toFixed(1)},${(pad + (hgt - 2 * pad) * (1 - (v - lo) / span)).toFixed(1)}`).join(" ");
  }
  function trendCls(hist) { const p = hist.slice(-31); return p.length < 2 || p[p.length - 1] === p[0] ? "flat" : p[p.length - 1] > p[0] ? "up" : "down"; }

  function render() {
    if (!data) return;
    myName = myHash ? (data.who || {})[myHash] || null : null;
    $("who").textContent = "";
    if (myName) $("who").append(h("b", { text: myName }), "님"); else $("who").textContent = "연결 안 됨";
    if (!selected || !data.stocks.some(s => s.c === selected)) selected = data.stocks[0] ? data.stocks[0].c : null;

    const rows = $("rows");
    rows.textContent = "";
    for (const s of data.stocks) {
      const c = changeOf(s);
      const b = document.createElement("button");
      b.className = "row";
      b.setAttribute("aria-pressed", String(s.c === selected));
      const jump = s.ev === 1 ? " 🚀" : s.ev === -1 ? " ☄️" : "";
      b.innerHTML = `<span class="name"></span><span class="num"><span class="price ${c.cls}"></span><br><span class="chg ${c.cls}"></span></span>` +
        `<svg viewBox="0 0 64 24" aria-hidden="true"><polyline fill="none" stroke-width="1.6" stroke="currentColor" class="${trendCls(s.h)}" points="${spark(s.h, 64, 24, 2)}"/></svg>`;
      b.querySelector(".name").textContent = s.i + s.n;
      b.querySelector(".price").textContent = Number(s.p).toLocaleString("ko-KR");
      b.querySelector(".chg").textContent = `${c.arrow} ${c.txt}${jump}`;
      b.setAttribute("aria-label", `${s.n} ${won(s.p)} ${c.cls === "up" ? "상승" : c.cls === "down" ? "하락" : "보합"} ${c.txt}`);
      b.addEventListener("click", () => { selected = s.c; render(); });
      if (lastPrice[s.c] !== undefined && lastPrice[s.c] !== s.p) b.classList.add("flash");
      lastPrice[s.c] = s.p;
      rows.appendChild(b);
    }
    renderChart();
    renderAccount();
    renderOrder();
    renderRank();
    renderDungeon();
    if (!data.on) showNotice("지금 주식봇이 꺼져 있어서 주문할 수 없어요.");
    else if (Date.now() - data.at > 3 * 60 * 1000) showNotice(`시세가 3분 넘게 멈춰 있어요. ${BOT_HOST}이 꺼져 있을 수 있어요.`);
    else showNotice("");
  }

  function renderChart() {
    const s = data.stocks.find(x => x.c === selected);
    const box = $("chart");
    if (!s || s.h.length < 2) { box.hidden = true; return; }
    box.hidden = false;
    const pts = s.h.slice(-31);
    const cls = trendCls(s.h);
    $("chartSvg").innerHTML = `<polyline fill="none" stroke-width="2" stroke="currentColor" vector-effect="non-scaling-stroke" class="${cls}" points="${spark(s.h, 300, 120, 6)}"/>`;
    $("chartLo").textContent = "최저 " + won(Math.min(...pts));
    $("chartHi").textContent = "최고 " + won(Math.max(...pts));
    $("chartSpan").textContent = `${s.i}${s.n} 최근 ${pts.length - 1}번 변동`;
  }

  function me() { return myName ? data.players.find(p => p.n === myName) || { n: myName, b: 0, h: {}, t: 0 } : null; }

  function renderAccount() {
    const body = $("accBody");
    const p = me();
    if (!p) { renderConnect(body); return; }
    body.className = "panel";
    $("accTitle").textContent = `${p.n}님 계좌`;
    let value = 0;
    const items = [];
    for (const s of data.stocks) {
      const lot = p.h[s.c];
      if (!lot || lot.q <= 0) continue;
      const v = lot.q * s.p;
      value += v;
      items.push({ s, lot, v, pl: v - lot.c });
    }
    body.innerHTML = `<div class="sum"><div>잔액<b id="aBal"></b></div><div>주식 평가<b id="aVal"></b></div><div>총 자산<b id="aTot"></b></div></div><ul class="list" id="aList"></ul>` +
      `<p class="small" style="margin:12px 0 0"><button class="ghost" id="unlink">이 기기에서 연결 끊기</button></p>`;
    $("aBal").textContent = won(p.b);
    $("aVal").textContent = won(value);
    $("aTot").textContent = won(p.b + value);
    const ul = $("aList");
    if (!items.length) ul.outerHTML = `<p class="empty">가진 주식이 없어요. 아래에서 종목을 골라 매수해 보세요.</p>`;
    for (const it of items) {
      const li = document.createElement("li");
      const pct = it.lot.c ? it.pl * 100 / it.lot.c : 0;
      li.innerHTML = `<span></span><span class="${it.pl >= 0 ? "pl-up" : "pl-down"}"></span><span class="sub"></span>`;
      li.children[0].textContent = `${it.s.i}${it.s.n} ${it.lot.q.toLocaleString("ko-KR")}주`;
      li.children[1].textContent = `${it.pl >= 0 ? "+" : "-"}${won(Math.abs(it.pl))} (${pct.toFixed(1)}%)`;
      li.children[2].textContent = `평단 ${won(Math.floor(it.lot.c / it.lot.q))} · 지금 ${won(it.s.p)} · 평가 ${won(it.v)}`;
      ul && ul.appendChild(li);
    }
    $("unlink").addEventListener("click", () => {
      if (!confirm(`이 기기에서 연결을 끊을까요? 다시 쓰려면 ${APP}에서 새로 연결해야 해요.`)) return;
      store.del("token"); store.del("code"); store.del("code_at");
      myHash = null; myName = null; render();
    });
  }

  function renderConnect(body) {
    if (body === $("accBody")) $("accTitle").textContent = "내 계좌";
    const code = store.get("code");
    const at = Number(store.get("code_at") || 0);
    const fresh = code && Date.now() - at < CODE_LIFE && store.get("token");
    body.className = body.className.replace(/\bhidden\b/, "").trim();
    if (!/connect/.test(body.className)) body.className += " connect";
    body.textContent = "";
    if (!fresh) {
      body.append(h("p", { text: `${APP} 계정과 연결하면 잔액·캐릭터를 보고 사이트에서 바로 주문하고 던전도 할 수 있어요.` }),
        h("button", { class: "brand", onclick: makeCode }, "연결 코드 받기"));
      return;
    }
    const cmd = `${PFX}사이트연결 ${code}`;
    const copy = h("button", { class: "ghost" }, "복사");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(cmd); copy.textContent = "복사됨"; } catch (e) { copy.textContent = "길게 눌러 복사"; }
    });
    body.append(h("p", null, `${APP} `, h("b", { text: ROOM }), "에 아래 글을 보내 주세요. 연결되면 이 화면이 저절로 바뀌어요."),
      h("div", { class: "code" }, h("span", { class: "cmd", text: cmd }), copy),
      h("p", { class: "small", style: "margin-top:10px" }, "코드는 15분 동안 쓸 수 있어요. ", h("button", { class: "ghost", onclick: makeCode }, "새 코드 받기")));
  }

  async function makeCode() {
    try {
      const token = store.get("token") || ("t" + randomText(31, "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"));
      for (let i = 0; i < 3; i++) {
        const code = randomText(6, CODE_CHARS);
        const sealed = await seal({ c: code, t: token, a: Date.now() });
        const r = await fetch(`${DB}/link/${code}.json`, { method: "PUT", body: JSON.stringify(sealed) });
        if (r.ok) {
          store.set("token", token); store.set("code", code); store.set("code_at", String(Date.now()));
          myHash = await sha256Hex(token);
          render();
          return;
        }
      }
      throw new Error("put");
    } catch (e) {
      $("accBody").append(h("p", { class: "small", text: "코드를 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요." }));
    }
  }

  function renderOrder() {
    const picks = $("picks");
    picks.textContent = "";
    for (const s of data.stocks) {
      const b = document.createElement("button");
      b.className = "pick";
      b.textContent = s.i + s.n;
      b.setAttribute("aria-pressed", String(s.c === selected));
      b.addEventListener("click", () => { selected = s.c; render(); });
      picks.appendChild(b);
    }
    estimate();
    const can = !!me() && data.on && !busy;
    $("buyBtn").disabled = !can;
    $("sellBtn").disabled = !can;
    if (!me() && !$("result").textContent) $("result").textContent = `주문하려면 먼저 위에서 ${APP} 계정과 연결해 주세요.`;
  }

  function estimate() {
    const s = data && data.stocks.find(x => x.c === selected);
    const all = $("all").checked;
    $("qty").disabled = all;
    if (!s) { $("est").textContent = ""; return; }
    const p = me();
    if (all) {
      const canBuy = p ? Math.floor(p.b / s.p) : 0;
      const have = p && p.h[s.c] ? p.h[s.c].q : 0;
      $("est").textContent = `전부: 살 수 있는 만큼 ${canBuy.toLocaleString("ko-KR")}주 · 팔면 ${have.toLocaleString("ko-KR")}주`;
    } else {
      const q = Math.max(1, Math.floor(Number($("qty").value) || 1));
      $("est").textContent = `${s.i}${s.n} ${q.toLocaleString("ko-KR")}주 ≈ ${won(q * s.p)}`;
    }
  }

  async function order(buy) {
    const s = data.stocks.find(x => x.c === selected);
    if (!s || !store.get("token") || busy) return;
    const all = $("all").checked;
    const q = all ? "all" : String(Math.max(1, Math.floor(Number($("qty").value) || 1)));
    busy = true; renderOrder();
    const out = $("result");
    out.className = "result";
    out.textContent = `${s.n} ${all ? "전부" : q + "주"} ${buy ? "매수" : "매도"} 주문을 봇에 보냈어요…`;
    try {
      const res = await sendOrder({ o: buy ? "b" : "s", k: s.c, q });
      out.className = res.ok ? "result" : "result err";
      out.textContent = res.m;
    } catch (e) {
      out.className = "result err";
      out.textContent = e.message === "too long" ? `종목 이름이 너무 길어서 주문을 만들 수 없어요. ${APP}에서 주문해 주세요.` : "주문을 보내지 못했어요. 인터넷 연결을 확인해 주세요.";
    } finally {
      busy = false;
      if (data) renderOrder();
    }
  }

  function renderRank() {
    const t = $("rank");
    t.textContent = "";
    const top = data.players.slice(0, 10);
    if (!top.length) { t.innerHTML = `<tr><td colspan="3" class="empty">아직 돈을 가진 사람이 없어요.</td></tr>`; return; }
    top.forEach((p, i) => {
      const tr = document.createElement("tr");
      if (p.n === myName) tr.className = "me";
      tr.innerHTML = "<td></td><td></td><td></td>";
      tr.children[0].textContent = i + 1;
      tr.children[1].textContent = p.n;
      tr.children[2].textContent = won(p.t);
      t.appendChild(tr);
    });
  }

  // ================= 던전 =================
  const meta = () => data.meta || { jobs: [], items: [], tiers: [], enh: [] };
  const ITEM = k => meta().items.find(x => x.k === k);
  const JOB = n => meta().jobs.find(j => j.n === n);
  const myRpg = () => myName && data.rpg ? data.rpg[myName] || { lv: 1, exp: 0, need: 100, eq: "", gw: "", ga: "", gx: "", enh: {}, bag: {}, jobs: [], upd: "" } : null;
  const myFight = () => myName && data.ft ? data.ft.find(f => f.f.some(m => m.n === myName)) || null : null;
  const mySlot = () => (myName && data.dg) ? data.dg.l.findIndex(s => !s.x && s.p.includes(myName)) : -1;
  const ENH_BASE = [10000, 30000, 100000, 300000];

  function say(text, err) {
    const r = $("dgReply");
    r.className = err ? "reply err" : "reply";
    r.textContent = text || "";
  }

  async function act(fields, label) {
    if (dgBusy) return;
    dgBusy = true; renderDungeon();
    say(`${label} …`);
    try {
      const res = await sendOrder(fields);
      say(res.m, !res.ok);
    } catch (e) {
      say(e.message === "nolink" ? `먼저 ${APP} 계정과 연결해 주세요.` : "보내지 못했어요. 인터넷 연결을 확인해 주세요.", true);
    } finally {
      dgBusy = false;
      if (data) renderDungeon();
    }
  }

  function renderDungeon() {
    if (!data) return;
    const on = !!data.dgOn && !!data.dg;
    $("dgOff").classList.toggle("hidden", on);
    $("dgBody").classList.toggle("hidden", !on);
    if (!on) return;
    const linked = !!myName;
    const cb = $("dgConnect");
    if (!linked) renderConnect(cb); else { cb.className = "panel connect hidden"; cb.textContent = ""; }
    renderFight();
    renderSlots();
    renderChar();
    renderBag();
    renderOthers();
    renderInfo();
  }

  function renderSlots() {
    const box = $("slots");
    box.textContent = "";
    const mine = mySlot();
    const inFight = !!myFight();
    for (const s of data.dg.l) {
      const hidden = s.t === "히든";
      const status = s.x === "run" ? h("span", { class: "chip run" }, "⚔️ 전투 중") : s.x === "win" ? h("span", { class: "chip win" }, "🏆 클리어")
        : s.x === "lose" ? h("span", { class: "chip lose" }, "☠️ 실패") : (s.m !== "?" && s.c >= Number(s.m)) ? h("span", { class: "chip" }, "가득") : h("span", { class: "chip" }, "모집 중");
      const btns = h("div", { class: "sb" });
      if (myName && !inFight && !s.x) {
        if (mine === s.i) {
          btns.append(h("button", { class: "bbtn go", disabled: dgBusy, onclick: () => act({ o: "ds" }, "출발") }, "⚔️ 출발"),
            h("button", { class: "bbtn", disabled: dgBusy, onclick: () => act({ o: "dl" }, "퇴장") }, "퇴장"));
        } else if (mine < 0) {
          const full = s.m !== "?" && s.c >= Number(s.m);
          btns.append(h("button", { class: "bbtn", disabled: dgBusy || full, onclick: () => act({ o: "dn", k: String(s.i), s: data.dg.s }, `${s.n} 입장`) }, "입장"));
        }
      }
      box.append(h("div", { class: "slot" },
        h("div", { class: "dn" }, hidden ? s.n : `${s.ic}${s.n}`),
        h("div", { class: "cnt" }, `${s.c}/${s.m}`),
        h("div", { class: "bs" }, s.b, " ", status),
        s.p.length ? h("div", { class: "pp" }, "👥 " + s.p.join(", ")) : null,
        btns.childNodes.length ? btns : null));
    }
  }

  function hpCls(f) { const r = f.hp / f.mhp; return r <= 0.25 ? "bar thin crit" : r <= 0.5 ? "bar thin low" : "bar thin"; }

  function renderFight() {
    const box = $("fightBox");
    box.textContent = "";
    const f = myFight();
    if (!f) return;
    const now = Date.now();
    const u = f.f.find(m => m.n === myName);
    const job = JOB(u.j);
    const pct = Math.max(0, Math.min(100, f.hp * 100 / f.max));
    const fx = h("div", { class: "fx" });
    if (f.st > 0) fx.append(h("span", { class: "chip" }, `💫 기절 ${f.st}번`));
    if (f.shn > 0) fx.append(h("span", { class: "chip" }, `🛡️ 보호막 ${f.shn}번 -${Math.round(f.shc * 100)}%`));
    if (f.tn > 0 && f.tkn) fx.append(h("span", { class: "chip" }, `🎯 도발 ${f.tkn} ${f.tn}번`));
    if (f.bu > now) fx.append(h("span", { class: "chip", "data-until": f.bu }, `🔥 공격력 +${Math.round(f.bm * 100)}%`));
    const party = h("ul", { class: "party" });
    for (const m of f.f) {
      const dead = m.hp <= 0;
      party.append(h("li", { class: dead ? "dead" : null },
        h("div", { class: "pn" }, h("span", null, `${dead ? "💀" : ""}${m.n} `, h("small", { class: "small" }, `${(JOB(m.j) || {}).mk || ""}${m.j} Lv.${m.lv || 1}`)),
          h("span", null, `${num(Math.max(0, m.hp))}/${num(m.mhp)}`)),
        h("div", { class: hpCls(m) }, h("i", { style: `width:${Math.max(0, Math.min(100, m.hp * 100 / m.mhp))}%` }))));
    }
    const board = h("div", { class: "board fight" },
      h("div", { class: "board-head" }, h("span", null, `⚔️ ${f.name}`), h("span", { class: "clock", id: "ftLeft", "data-end": f.until }, "")),
      h("div", { class: "bossname" }, f.boss),
      h("div", { class: "bar" }, h("i", { style: `width:${pct}%` })),
      h("div", { class: "hpnum" }, h("span", null, `${num(Math.max(0, f.hp))} / ${num(f.max)}`), h("span", null, `${pct.toFixed(1)}%`)),
      fx.childNodes.length ? fx : null,
      party);
    // 행동 버튼
    const ready = u.last + u.cd;
    const acts = h("div", { class: "acts" });
    const dead = u.hp <= 0;
    acts.append(h("button", { class: "act atk", "data-ready": ready, disabled: dgBusy || dead, onclick: () => act({ o: "da" }, "공격") },
      h("b", null, "⚔️ 공격"), h("small", { class: "cd" }, "")));
    (job ? job.sk : []).forEach((sk, i) => {
      const r = Math.max(ready, (u.sc || [])[i] || 0);
      acts.append(h("button", { class: "act", "data-ready": r, disabled: dgBusy || dead, onclick: () => act({ o: "dk", k: String(i + 1) }, `기술${i + 1}`) },
        h("b", null, `${i + 1}. ${sk.n}`), h("small", null, sk.d), h("small", { class: "cd" }, "")));
    });
    const uses = h("div", { class: "uses" });
    const bag = (myRpg() || {}).bag || {};
    for (const it of meta().items.filter(x => x.kd === "USE")) {
      const n = bag[it.k] || 0;
      if (n > 0) uses.append(h("button", { class: "btn", disabled: dgBusy, title: it.d, onclick: () => act({ o: "du", k: it.k }, it.l) }, `${it.l} ×${n}`));
    }
    box.append(board, acts, uses.childNodes.length ? uses : h("p", { class: "small", style: "margin:8px 0 0" }, "소모품이 없어요 (아래 제작에서 만들 수 있어요)"));
    tickFight();
  }

  function tickFight() {
    const now = Date.now();
    const left = document.querySelector("#ftLeft");
    if (left) left.textContent = Number(left.dataset.end) > now ? `남은 ${dur(Number(left.dataset.end) - now)}` : "시간 끝";
    document.querySelectorAll(".act[data-ready]").forEach(b => {
      const r = Number(b.dataset.ready) - now;
      const cd = b.querySelector(".cd");
      if (cd) cd.textContent = r > 0 ? `⏳ ${durText(r)}` : "준비됨";
    });
    const clk = $("dgClock");
    if (data && data.dg && clk) {
      const end = data.dg.s + data.dg.per;
      clk.textContent = end > now ? `리셋 ${dur(end - now)}` : "리셋 중";
    }
  }

  function gearLabel(k, enh) { const it = ITEM(k); if (!it) return "없음"; const lv = (enh || {})[k] || 0; return it.l + (lv > 0 ? ` +${lv}` : ""); }

  function renderChar() {
    const body = $("charBody");
    body.textContent = "";
    const r = myRpg();
    $("charSec").classList.toggle("hidden", !r);
    if (!r) return;
    const job = JOB(r.eq);
    const owned = new Set(r.jobs || []);
    const xpPct = r.need ? Math.min(100, r.exp * 100 / r.need) : 100;
    const bonus = ((r.lv - 1) * (meta().lvb || 0.015) * 100).toFixed(1).replace(/\.0$/, "");
    body.append(
      h("dl", { class: "kv" },
        h("dt", null, "레벨"), h("dd", null, h("b", null, `Lv.${r.lv}`), ` (${num(r.exp)} / ${num(r.need)} 경험치, 공격력·체력 +${bonus}%)`),
        h("dt", null, "직업"), h("dd", null, job ? `${job.mk}${job.n} (공격 ${num(job.atk)} · 체력 ${num(job.hp)})` : "없음 (무직)"),
        h("dt", null, "무기"), h("dd", null, gearLabel(r.gw, r.enh)),
        h("dt", null, "갑옷"), h("dd", null, gearLabel(r.ga, r.enh)),
        h("dt", null, "장신구"), h("dd", null, gearLabel(r.gx, r.enh))),
      h("div", { class: "xp", role: "img", "aria-label": `경험치 ${xpPct.toFixed(0)}%` }, h("i", { style: `width:${xpPct}%` })),
      h("h3", null, `내 직업 (${owned.size}/${meta().jobs.length}) · 눌러서 장착`));
    const jobs = h("div", { class: "jobs" });
    for (const j of meta().jobs) {
      const have = owned.has(j.n);
      jobs.append(h("button", { class: have ? "job" : "job locked", "aria-pressed": String(r.eq === j.n), disabled: !have || dgBusy || !!myFight(),
        title: have ? `${j.n} 장착` : "아직 못 뽑음", onclick: () => act({ o: "de", k: j.n }, `${j.n} 장착`) }, `${j.mk}${j.n}`));
    }
    const tickets = (r.bag || {}).ticket || 0;
    const updNew = data.ver && r.upd !== data.ver;
    body.append(jobs, h("div", { class: "btns" },
      h("button", { class: "btn main", disabled: dgBusy || tickets < 1, onclick: () => act({ o: "dj" }, "직업뽑기") }, `🎲 직업뽑기 (뽑기권 ${tickets}장)`),
      h("button", { class: "btn", disabled: dgBusy || !updNew, onclick: () => act({ o: "dr" }, "업뎃보상") }, updNew ? "🎁 업뎃보상 받기" : data.ver ? "🎁 업뎃보상 받음" : "🎁 받을 업뎃보상 없음")));
  }

  function renderBag() {
    const body = $("bagBody");
    if (body.contains(document.activeElement) && /SELECT|INPUT/.test(document.activeElement.tagName)) return;   // 고르는 중엔 안 바꿈
    body.textContent = "";
    const r = myRpg();
    $("bagSec").classList.toggle("hidden", !r);
    if (!r) return;
    const bag = r.bag || {};
    const items = meta().items;
    const mats = items.filter(x => x.kd === "MAT" || x.kd === "TICKET" || x.kd === "SPECIAL" || x.kd === "USE").filter(x => (bag[x.k] || 0) > 0);
    body.append(h("h3", { style: "margin-top:0" }, "재료 · 소모품"),
      mats.length ? h("ul", { class: "bag" }, mats.map(x => h("li", { title: fixText(x.d) }, `${x.l} ×${num(bag[x.k])}`))) : h("p", { class: "empty" }, "아직 아무것도 없어요. 던전을 깨면 재료가 나와요."));
    const voidIt = items.find(x => x.kd === "SPECIAL");
    if (voidIt && (bag[voidIt.k] || 0) > 0) body.append(h("div", { class: "btns" },
      h("button", { class: "btn main", disabled: dgBusy, onclick: () => act({ o: "du", k: voidIt.k }, voidIt.l) }, `${voidIt.l} 사용`)));
    // 장비
    const gear = items.filter(x => (x.kd === "WEAPON" || x.kd === "ARMOR" || x.kd === "ACC") && (bag[x.k] || 0) > 0);
    body.append(h("h3", null, "장비"));
    if (!gear.length) body.append(h("p", { class: "empty" }, "만든 장비가 없어요."));
    else {
      const ul = h("ul", { class: "list gear" });
      const money = (me() || { b: 0 }).b;
      for (const x of gear) {
        const lv = (r.enh || {})[x.k] || 0;
        const worn = r.gw === x.k || r.ga === x.k || r.gx === x.k;
        const next = lv + 1;
        const maxed = lv >= (meta().enh || []).length;
        const cost = maxed ? 0 : ENH_BASE[Math.max(0, Math.min(3, (x.g || 1) - 1))] * next * next;
        const rate = maxed ? 0 : meta().enh[next - 1];
        ul.append(h("li", null,
          h("span", null, h("b", null, gearLabel(x.k, r.enh)), worn ? " · 장착 중" : ""),
          h("span", { class: "gb" },
            worn ? null : h("button", { class: "btn", disabled: dgBusy || !!myFight(), onclick: () => act({ o: "de", k: x.k }, `${x.l} 장착`) }, "장착"),
            maxed ? h("span", { class: "small" }, "최대") : h("button", { class: "btn", disabled: dgBusy || money < cost, onclick: () => act({ o: "dh", k: x.k }, `${x.l} 강화`) }, `+${next} 강화`)),
          h("span", { class: "sub" }, fixText(x.d) + (maxed ? "" : ` · +${next} 성공 ${rate}% · ${won(cost)}`))));
      }
      body.append(ul);
    }
    // 제작
    const craftable = items.filter(x => x.r);
    if (!craftPick || !craftable.some(x => x.k === craftPick)) craftPick = craftable[0] ? craftable[0].k : null;
    const sel = h("select", { "aria-label": "만들 아이템" }, craftable.map(x => h("option", { value: x.k, selected: x.k === craftPick }, `${x.l} (${fixText(x.d)})`)));
    const qty = h("input", { class: "inp", type: "number", min: "1", max: "20", value: String(craftQty), inputmode: "numeric", "aria-label": "개수", style: "width:80px" });
    const needBox = h("div", { class: "need" });
    const showNeed = () => {
      const x = ITEM(sel.value);
      craftPick = sel.value;
      const q = Math.max(1, Math.min(20, Math.floor(Number(qty.value) || 1)));
      craftQty = q;
      needBox.textContent = "";
      needBox.append("필요: ");
      Object.entries(x.rc || {}).forEach(([k, n], i) => {
        const have = bag[k] || 0, want = n * q;
        if (i) needBox.append(" · ");
        needBox.append(h("span", { class: have < want ? "lack" : null }, `${(ITEM(k) || { l: k }).l} ${num(have)}/${num(want)}`));
      });
    };
    sel.addEventListener("change", showNeed);
    qty.addEventListener("input", showNeed);
    showNeed();
    body.append(h("h3", null, "제작"), h("div", { class: "craft" }, sel, needBox,
      h("div", { class: "qty" }, qty, h("span", null, "개"),
        h("button", { class: "btn main", disabled: dgBusy, onclick: () => {
          const q = Math.max(1, Math.min(20, Math.floor(Number(qty.value) || 1)));
          act({ o: "dc", k: sel.value, q: String(q) }, `${ITEM(sel.value).l} ${q}개 제작`);
        } }, "제작"))));
  }

  function renderOthers() {
    const box = $("others");
    box.textContent = "";
    const list = (data.ft || []).filter(f => !f.f.some(m => m.n === myName));
    $("othersSec").classList.toggle("hidden", !list.length);
    const ul = h("ul", { class: "list" });
    for (const f of list) {
      const pct = Math.max(0, f.hp * 100 / f.max);
      ul.append(h("li", null, h("span", null, `⚔️ ${f.name}`), h("span", null, `${pct.toFixed(1)}%`),
        h("span", { class: "sub" }, `${f.boss} · ${f.f.map(m => (m.hp <= 0 ? "💀" : "") + m.n).join(", ")}`)));
    }
    box.append(ul);
  }

  let infoBuilt = false;
  function renderInfo() {
    if (infoBuilt) return;
    infoBuilt = true;
    const box = $("info");
    const tiers = h("ul", { class: "jinfo" }, meta().tiers.map(t => h("li", null, h("b", null, `${t.ic}${t.ti}`),
      h("div", { class: "sk" }, `클리어 ${won(t.m)} · 경험치 ${num(t.xp)}\n${t.dr}`))));
    const jobs = h("ul", { class: "jinfo" }, meta().jobs.map(j => h("li", null, h("b", null, `${j.mk}${j.n}`),
      h("span", { class: "small" }, ` 공격 ${num(j.atk)} · 체력 ${num(j.hp)} · ${j.pct}`),
      h("div", { class: "sk" }, `패시브 ${j.ps}: ${j.pd}\n` + j.sk.map((s, i) => `${i + 1}. ${s.n} (${durText(s.cd)}) ${s.d}`).join("\n")))));
    box.append(
      h("details", null, h("summary", null, "던전 보상 (클리어할 때만)"), tiers, h("p", { class: "small" }, "실패하면 보상이 없어요.")),
      h("details", null, h("summary", null, "직업과 기술"), jobs));
  }

  function tick() {
    if (!data) return;
    const ago = Math.max(0, Math.round((Date.now() - data.at) / 1000));
    $("status").textContent = ago < 5 ? "방금 업데이트" : `${ago}초 전 업데이트`;
    const left = Math.round((data.next - Date.now()) / 1000);
    $("clock").textContent = left > 0 ? `다음 변동 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "변동 중";
    tickFight();
  }

  $("qty").addEventListener("input", estimate);
  $("all").addEventListener("change", estimate);
  $("buyBtn").addEventListener("click", () => order(true));
  $("sellBtn").addEventListener("click", () => order(false));
  $("tabStock").addEventListener("click", () => setTab("stock"));
  $("tabDg").addEventListener("click", () => setTab("dg"));
  setTab(tab);

  (async () => {
    try { await keys(); }
    catch (e) { $("status").textContent = "이 주소에서는 열 수 없어요. https:// 로 시작하는 주소로 열어 주세요."; return; }
    const t = store.get("token");
    if (t) myHash = await sha256Hex(t);
    await poll();
    setInterval(poll, 2500);
    setInterval(tick, 1000);
  })();
})();
</script>
</body>
</html>
